name: Recover client-usable verified tree
on:
  push:
    branches: [fix/bot-legacy-layer-restore]
    paths:
      - client-usable-train.patch
      - .github/workflows/recover-client-usable.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bot-legacy-layer-restore
          fetch-depth: 0
      - name: Verify and apply exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0414e7dec24b3343c5bb837b0d5317df48e0e34d HEAD
          test "$(sha256sum client-usable-train.patch | awk '{print $1}')" = "8d29173fc3fcd50994739cef294fc9a171339d9e001b6d7336d40387df5fa7e7"
          git am --3way client-usable-train.patch
          rm client-usable-train.patch .github/workflows/recover-client-usable.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "627fb4e2d77293dd2d3b2339937e28bd3dd0e815"
      - name: Push verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(bot): recover client-usable verified tree"
          git push origin HEAD:fix/bot-legacy-layer-restore
